[project]
name = "python-cloud-queues"
version = "0.0.0"
description = "Plain-Python app that checks whether Python works on a Laravel Cloud deployment."
requires-python = ">=3.10"
dependencies = [
    "laravel-cloud-queues[redis]>=0.2.2",
    "pymysql",
    "certifi",
    "gunicorn",
    "uvicorn",
    "laravel-cloud-logging==0.3.1",
    "psycopg[binary]>=3.3.6",
    "websockets>=16.1.1",
    "granian>=2.8.4",
    "hypercorn>=0.18.0",
    "daphne>=4.2.3",
    "waitress>=3.0.2",
    "pyuwsgi>=2.0.30.post1",
]

[tool.uv]
package = false

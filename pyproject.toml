[project]
name = "python-cloud-queues"
version = "0.0.0"
description = "Plain-Python app that checks whether Python works on a Laravel Cloud deployment."
requires-python = ">=3.10"
dependencies = [
    "laravel-cloud-queues[redis]>=0.2.1",
    "pymysql",
    "certifi",
    "gunicorn",
    "uvicorn",
    "laravel-cloud-logging>=0.2.1",
    "psycopg[binary]>=3.3.6",
    "websockets>=16.1.1",
]

[tool.uv]
package = false

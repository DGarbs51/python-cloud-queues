[project]
name = "python-cloud-queues"
version = "0.0.0"
description = "Plain-Python demo of laravel-cloud-queues from PyPI: a queue telemetry dashboard on the Redis backend."
requires-python = ">=3.10"
dependencies = [
    "laravel-cloud-queues[redis]>=0.1.1",
    "pymysql",
    "certifi",
    "gunicorn",
    "uvicorn",
    "laravel-cloud-logging>=0.1.2",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false
